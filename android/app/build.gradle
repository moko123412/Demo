plugins {
    id 'com.android.application'
}

android {
    namespace 'com.menagerie.zoo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.menagerie.zoo'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2-portrait'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/www"
    }
}

// Copy the web game into the APK so the app always matches the web version.
def copyGame = tasks.register('copyGame', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'css/**', 'js/**'
    }
    into "$buildDir/generated/www/www"
}
tasks.named('preBuild') { dependsOn copyGame }
